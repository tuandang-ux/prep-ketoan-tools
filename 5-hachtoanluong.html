// Normalize text: lowercase, remove diacritics, collapse whitespace and newlines.
function normText(s) {
  return String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'd')
    .toLowerCase()
    .replace(/\s+/g, ' ')
    .trim();
}

// Extract percentage number from a text like "BHXH (17%)", "17%", etc.
function extractPercent(s) {
  if (!s) return null;
  const m = /(\d+[.,]?\d*)\s*%/.exec(String(s));
  if (!m) return null;
  return parseFloat(m[1].replace(',', '.'));
}

// Read header rows (6, 7, 8) for each column - returns array of {idx, r6, r7, r8, combined}
function readHeaders(ws) {
  const cols = [];
  const maxCol = 40; // enough for all plausible columns
  for (let c = 0; c < maxCol; c++) {
    const r6 = getCellStr(ws, 6, c);
    const r7 = getCellStr(ws, 7, c);
    const r8 = getCellStr(ws, 8, c);
    const combined = normText(`${r6} ${r7} ${r8}`);
    cols.push({ idx: c, r6, r7, r8, combined, r7norm: normText(r7), r8norm: normText(r8) });
  }
  return cols;
}

// Propagate group headers across merged cells: if row 7 has "Khoản trích tính vào CP" only
// at col Q, the cols R-U should inherit it. Detect by: walk left until a non-empty r7 text.
function propagateGroupHeaders(cols) {
  let lastR7 = '';
  for (const c of cols) {
    if (c.r7 && c.r7.trim()) {
      lastR7 = c.r7;
    } else if (lastR7 && (c.r8 && c.r8.trim())) {
      // Inherit group from the left
      c.r7 = lastR7;
      c.r7norm = normText(lastR7);
    }
  }
}

// Score a column for a given field. Returns number (higher = better) or -1 (not a match).
function scoreColumn(col, field) {
  const text = col.combined;
  // Exclude keywords: if any match, this column is not this field
  if (field.excludeKeywords) {
    for (const ex of field.excludeKeywords) {
      if (text.includes(ex)) return -1;
    }
  }
  // Keyword presence
  let kwMatch = false;
  for (const kw of field.keywords) {
    if (field.strict) {
      const kwRegex = new RegExp(`(^|\\s|-|_|\\(|\\|)${kw.replace(/\s+/g, '\\s*')}($|\\s|-|_|\\)|:|\\|)`, 'i');
      if (kwRegex.test(text)) { kwMatch = true; break; }
    } else {
      if (text.includes(kw)) { kwMatch = true; break; }
    }
  }
  if (!kwMatch) return -1;
  let score = 10; // base

  // Context group match: bonus
  if (field.contextGroup) {
    if (col.r7norm && col.r7norm.includes(field.contextGroup)) score += 50;
    else if (col.r7norm) score -= 20;
  }
  // Percent match: strong signal
  if (field.percent !== undefined) {
    const p = extractPercent(col.r8) || extractPercent(col.r7);
    if (p !== null) {
      if (Math.abs(p - field.percent) < 0.01) score += 100;
      else score -= 30;
    }
  }
  // Penalize columns that are obviously other fields
  if (text.includes('cong') && text.length < 10 && field.key !== 'U_KPCD_DN' && field.key !== 'Y_KPCD_NLD') {
    score -= 50;
  }
  return score;
}

// Auto-detect all fields from a worksheet. Returns {mapping, issues, cols}
function autoDetectColumns(ws) {
  const cols = readHeaders(ws);
  propagateGroupHeaders(cols);
  const mapping = {};
  const issues = []; // list of missing/ambiguous field keys
  const scores = {}; // for debug

  for (const field of FIELD_DEFS) {
    let bestCol = null, bestScore = -1, tiedCols = [];
    for (const c of cols) {
      // Skip columns already assigned to another field with higher priority
      const s = scoreColumn(c, field);
      if (s > bestScore) {
        bestCol = c; bestScore = s; tiedCols = [c];
      } else if (s === bestScore && s >= 0) {
        tiedCols.push(c);
      }
    }
    scores[field.key] = { bestScore, colIdx: bestCol ? bestCol.idx : null };
    if (bestScore < 0 || !bestCol) {
      issues.push({ field: field.key, label: field.label, reason: 'not_found' });
      continue;
    }
    // Ambiguity check: multiple cols tied
    if (tiedCols.length > 1) {
      // If 2 cols tied on e.g. BHXH without clear percent/group — use the first one for DN, last for NLD
      // For DN fields, prefer left (lower idx). For NLD fields, prefer right.
      if (field.contextGroup === 'khoan tru vao luong') {
        tiedCols.sort((a, b) => b.idx - a.idx); // higher idx first
      } else {
        tiedCols.sort((a, b) => a.idx - b.idx);
      }
      bestCol = tiedCols[0];
      issues.push({ field: field.key, label: field.label, reason: 'ambiguous', count: tiedCols.length });
    }
    mapping[field.key] = bestCol.idx;
  }

  return { mapping, issues, cols };
}

// Compute a stable fingerprint of a workbook's Fulltime sheet headers.
// Used to remember user-confirmed column mappings.
function computeWorkbookFingerprint(ws) {
  const cols = readHeaders(ws);
  const hdrs = cols.map(c => c.combined).filter(t => t).join('|');
  // Simple DJB2 hash
  let h = 5381;
  for (let i = 0; i < hdrs.length; i++) {
    h = ((h << 5) + h) + hdrs.charCodeAt(i);
    h = h | 0;
  }
  return 'fp' + Math.abs(h).toString(36);
}

// Excel column letter from 0-based index (0 → A, 25 → Z, 26 → AA ...)
function colIdxToLetter(idx) {
  let s = '';
  let n = idx + 1;
  while (n > 0) {
    const r = (n - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}
function colLetterToIdx(letter) {
  let n = 0;
  const up = String(letter || '').toUpperCase();
  for (let i = 0; i < up.length; i++) {
    const c = up.charCodeAt(i) - 64;
    if (c < 1 || c > 26) return -1;
    n = n * 26 + c;
  }
  return n - 1;
}



function getCellVal(ws, row1based, col0based) {
  const addr = XLSX.utils.encode_cell({ r: row1based - 1, c: col0based });
  const cell = ws[addr];
  if (!cell) return 0;
  const v = cell.v;
  if (typeof v === 'number') return v;
  if (typeof v === 'string') {
    const n = parseFloat(v.replace(/[^0-9.-]/g, ''));
    return isNaN(n) ? 0 : n;
  }
  return 0;
}
function getCellStr(ws, row1based, col0based) {
  const addr = XLSX.utils.encode_cell({ r: row1based - 1, c: col0based });
  const cell = ws[addr];
  if (!cell) return '';
  return normalize(cell.v);
}
function sumCol(ws, rows, col0based) {
  return rows.reduce((s, r) => s + getCellVal(ws, r, col0based), 0);
}

function detectSubtotals(ws) {
  const subtotals = [];
  const ref = ws['!ref'];
  if (!ref) return subtotals;
  const range = XLSX.utils.decode_range(ref);
  // Dynamic column letter - uses current COL_P mapping
  const colLetter = colIdxToLetter(COL_P);
  const escLetter = colLetter.replace(/([a-z])/gi, (c) => `[${c.toUpperCase()}${c.toLowerCase()}]`);
  const re = new RegExp(`^=?\\s*SUBTOTAL\\s*\\(\\s*9\\s*,\\s*${escLetter}(\\d+)(?::${escLetter}(\\d+))?\\s*\\)$`, 'i');
  for (let r = range.s.r; r <= range.e.r; r++) {
    const addr = XLSX.utils.encode_cell({ r, c: COL_P });
    const cell = ws[addr];
    if (!cell || !cell.f) continue;
    const m = re.exec(cell.f);
    if (!m) continue;
    const start = parseInt(m[1], 10);
    const end = m[2] ? parseInt(m[2], 10) : start;
    const name = getCellStr(ws, r + 1, COL_MANV);
    subtotals.push({ row: r + 1, name, rangeStart: start, rangeEnd: end });
  }
  return subtotals;
}

function directRows(S, all) {
  const covered = new Set();
  for (const c of all) {
    if (c === S) continue;
    if (c.row >= S.rangeStart && c.row <= S.rangeEnd) {
      for (let r = c.row; r <= c.rangeEnd; r++) covered.add(r);
    }
  }
  const result = [];
  for (let r = S.rangeStart; r <= S.rangeEnd; r++) {
    if (!covered.has(r)) result.push(r);
  }
  return result;
}

function employeeInfo(ws, rows) {
  return rows.map(r => ({
    row: r,
    maNV: getCellStr(ws, r, COL_MANV),
    hoTen: getCellStr(ws, r, COL_HOTEN),
    p: getCellVal(ws, r, COL_P),
    l: getCellVal(ws, r, COL_L),
  }));
}

// Flexible sheet detection: returns { kind, month, year } or null.
// Accepts wide range of naming variations.
function parseSheetName(name) {
  if (!name) return null;
  const raw = String(name);
  // Normalize: remove accents, lowercase, collapse whitespace
  const norm = raw
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/\s+/g, ' ')
    .trim();

  // Detect kind: check longer keywords first to avoid "ft" matching inside "fulltime"
  let kind = null;
  if (/\bfull[\s\-_]?time\b|\bfulltime\b|\bft\b/.test(norm)) kind = 'Fulltime';
  else if (/\bpart[\s\-_]?time\b|\bparttime\b|\bpt\b/.test(norm)) kind = 'Parttime';
  else if (/\bnsnn\b|\bns nn\b|ngan sach nha nuoc|ngan sach/.test(norm)) kind = 'NSNN';
  if (!kind) return null;

  // Detect month/year: try several patterns
  // Pattern 1: "thang 01.2026" / "thang 1/2026" / "tháng 01-2026" (after normalization)
  let m = /thang\s*(\d{1,2})\s*[.\-\/]\s*(\d{4})/.exec(norm);
  if (!m) {
    // Pattern 2: "t01/2026" / "t1.2026" / "t1-2026"
    m = /\bt\s*(\d{1,2})\s*[.\-\/]\s*(\d{4})/.exec(norm);
  }
  if (!m) {
    // Pattern 3: "01.2026" / "01/2026" / "01-2026" (bare)
    m = /\b(\d{1,2})\s*[.\-\/]\s*(\d{4})\b/.exec(norm);
  }
  if (!m) {
    // Pattern 4: "2026.01" / "2026/1" (reversed)
    const m2 = /\b(\d{4})\s*[.\-\/]\s*(\d{1,2})\b/.exec(norm);
    if (m2) m = [m2[0], m2[2], m2[1]];
  }
  if (!m) return null;
  const month = parseInt(m[1], 10);
  const year = parseInt(m[2], 10);
  if (month < 1 || month > 12 || year < 2000 || year > 2100) return null;
  return { month, year, kind };
}

/* =====================================================================
   PROCESSING
   ===================================================================== */

function pushRow(out, period, type, misa, tk, amount, meta, opts = {}) {
  if (!amount) return;
  const defaultPrefix = (type === 'hoa hồng') ? 'Chi phí hoa hồng' : 'Chi phí lương';
  const prefix = opts.prefix || defaultPrefix;
  const baseText = `${prefix} T${period.mm}/${period.yyyy}`;
  out.push({
    dienGiaiHT: opts.dienGiaiHT || (misa ? `${baseText} - ${misa}` : baseText),
    dienGiai: opts.dienGiai || baseText,
    tkNo: tk, tkCo: opts.tkCo || '3341', soTien: amount,
    maDTNo: opts.maDTNo || '', maDTCo: opts.maDTCo || '',
    kenh: meta?.kenh || '', duAn: meta?.duAn || '',
    sanPham: meta?.sanPham || '', thiTruong: meta?.thiTruong || '',
  });
}

function metaOf(rule) {
  return { kenh: rule.kenh, duAn: rule.duAn, sanPham: rule.sanPham, thiTruong: rule.thiTruong };
}

// Context-driven team processor. Generates rows for ONE team based on its rule and a config.
// cfg: { column, tkCo, prefix, applyHH (default false), prefixHH, maDTNo, maDTCo, fixedTkNo, labelSuffix }
function processTeamWithCtx(ws, teamSub, allSubs, rule, period, cfg) {
  const rows = directRows(teamSub, allSubs);
  const out = [];
  if (rows.length === 0) return out;
  const meta = metaOf(rule);
  const labelSuffix = cfg.labelSuffix || '';
  const misaLabel = (rule.misa || '') + labelSuffix;
  const baseOpts = { tkCo: cfg.tkCo, prefix: cfg.prefix, maDTNo: cfg.maDTNo, maDTCo: cfg.maDTCo };
  const hhOpts = { ...baseOpts, prefix: cfg.prefixHH || 'Chi phí hoa hồng' };

  // If rule is custom with splits (from wizard), handle those first (salary only)
  if (rule.splits && cfg.column === COL_P && cfg.applyHH !== undefined) {
    const excluded = new Set();
    for (const group of rule.splits) {
      const groupSet = new Set(group.maNVs || []);
      for (const r of rows) {
        const manv = getCellStr(ws, r, COL_MANV);
        if (groupSet.has(manv)) excluded.add(r);
      }
    }
    for (const group of rule.splits) {
      const groupSet = new Set(group.maNVs || []);
      const groupRows = rows.filter(r => groupSet.has(getCellStr(ws, r, COL_MANV)));
      const groupSumP = sumCol(ws, groupRows, COL_P);
      for (const alloc of (group.allocations || [])) {
        const amount = groupSumP * (alloc.percent || 0) / 100;
        const label = (alloc.misa || rule.misa) + labelSuffix;
        const allocMeta = {
          kenh: alloc.kenh || meta.kenh,
          duAn: alloc.duAn || meta.duAn,
          sanPham: alloc.sanPham || meta.sanPham,
          thiTruong: alloc.thiTruong || meta.thiTruong,
        };
        pushRow(out, period, 'main', label, alloc.tk, amount, allocMeta, baseOpts);
      }
    }
    const normalRows = rows.filter(r => !excluded.has(r));
    const sumMain = sumCol(ws, normalRows, cfg.column);
    const sumL = cfg.applyHH ? sumCol(ws, normalRows, COL_L) : 0;
    if (rule.tkHH && cfg.applyHH) {
      pushRow(out, period, 'main', misaLabel, cfg.fixedTkNo || rule.tk, sumMain - sumL, meta, baseOpts);
      pushRow(out, period, 'hoa hồng', misaLabel, rule.tkHH, sumL, meta, hhOpts);
    } else {
      pushRow(out, period, 'main', misaLabel, cfg.fixedTkNo || rule.tk, sumMain, meta, baseOpts);
    }
    return out;
  }

  const sumMain = sumCol(ws, rows, cfg.column);
  const sumL = cfg.applyHH ? sumCol(ws, rows, COL_L) : 0;

  // Dispatch based on rule.kind (built-in) or shape (custom)
  const kind = rule.kind;
  if (kind === 'split_50_50') {
    if (cfg.fixedTkNo) {
      // Fixed TK — no split by TK (but could still split by 50/50 for diễn giải?)
      // User didn't specify; treat as aggregate for simplicity
      pushRow(out, period, 'main', misaLabel, cfg.fixedTkNo, sumMain, meta, baseOpts);
    } else {
      const half = sumMain / 2;
      pushRow(out, period, 'main', misaLabel, rule.tk[0], half, meta, baseOpts);
      pushRow(out, period, 'main', misaLabel, rule.tk[1], half, meta, baseOpts);
    }
  } else if (kind === 'aca_rd_special') {
    if (cfg.fixedTkNo) {
      pushRow(out, period, 'main', misaLabel, cfg.fixedTkNo, sumMain, meta, baseOpts);
    } else {
      const highMgrs = new Set(rule.highMgrs || []);
      let sumHigh = 0, sumNormal = 0;
      for (const r of rows) {
        const maNV = getCellStr(ws, r, COL_MANV);
        const v = getCellVal(ws, r, cfg.column);
        if (highMgrs.has(maNV)) sumHigh += v;
        else sumNormal += v;
      }
      const halfM = sumHigh / 2;
      pushRow(out, period, 'main', rule.misa, rule.tk, halfM, meta, baseOpts);
      pushRow(out, period, 'main', rule.specialMisa, rule.specialTk, halfM, meta, baseOpts);
      pushRow(out, period, 'main', rule.misa, rule.tk, sumNormal, meta, baseOpts);
    }
  } else if (kind === 'kinhdoanh' || (!kind && rule.tkHH)) {
    // Kinh doanh: split lương + hoa hồng IF applyHH
    if (cfg.applyHH) {
      pushRow(out, period, 'main', misaLabel, cfg.fixedTkNo || rule.tk, sumMain - sumL, meta, baseOpts);
      pushRow(out, period, 'hoa hồng', misaLabel, rule.tkHH, sumL, meta, hhOpts);
    } else {
      // Non-salary file: don't split, just use main TK
      pushRow(out, period, 'main', misaLabel, cfg.fixedTkNo || rule.tk, sumMain, meta, baseOpts);
    }
  } else {
    // backoffice, backoffice_direct, or custom without tkHH
    pushRow(out, period, 'main', misaLabel, cfg.fixedTkNo || rule.tk, sumMain, meta, baseOpts);
  }
  return out;
}

// Main sheet processor with context — returns {rows, pending}
function processSheetWithCtx(ws, sheetType, period, userRules, cfg) {
  const subs = detectSubtotals(ws);
  const rows = [];
  const pending = [];
  const containerNames = sheetType === 'Fulltime' ? FT_CONTAINER_NAMES
    : sheetType === 'Parttime' ? PT_CONTAINER_NAMES : new Set();

  for (const s of subs) {
    const name = s.name;
    if (containerNames.has(name)) continue;
    const empRows = directRows(s, subs);
    if (empRows.length === 0) continue;

    if (sheetType === 'NSNN') {
      // NSNN: fixed TK 6224 (or use cfg.fixedTkNo if provided for other files)
      const sumV = sumCol(ws, empRows, cfg.column);
      const tk = cfg.fixedTkNo || '6224';
      const abbrName = name.replace(/^Bộ [Pp]hận\s+/, 'BP ');
      pushRow(rows, period, 'main', `${abbrName} (NSNN)`, tk, sumV, META_BACKOFFICE, {
        tkCo: cfg.tkCo, prefix: cfg.prefix, maDTNo: cfg.maDTNo, maDTCo: cfg.maDTCo,
      });
      continue;
    }

    const rule = resolveRule(sheetType, name, userRules);
    if (!rule) {
      pending.push({
        sheetType, name, row: s.row,
        employees: employeeInfo(ws, empRows),
        totalP: sumCol(ws, empRows, COL_P),
        totalL: sumCol(ws, empRows, COL_L),
      });
      continue;
    }
    const labelSuffix = sheetType === 'Parttime' ? ' (Parttime)' : '';
    rows.push(...processTeamWithCtx(ws, s, subs, rule, period, { ...cfg, labelSuffix }));
  }
  return { rows, pending };
}

// Backwards compat wrappers (still used by file 1 logic)
function processBuiltinFulltime(ws, teamSub, allSubs, rule, period) {
  return processTeamWithCtx(ws, teamSub, allSubs, rule, period, {
    column: COL_P, tkCo: '3341', prefix: 'Chi phí lương', prefixHH: 'Chi phí hoa hồng',
    applyHH: true,
  });
}
function processCustomRule(ws, teamSub, allSubs, userRule, period, sheetType) {
  const labelSuffix = sheetType === 'Parttime' ? ' (Parttime)' : sheetType === 'NSNN' ? ' (NSNN)' : '';
  return processTeamWithCtx(ws, teamSub, allSubs, userRule, period, {
    column: COL_P, tkCo: '3341', prefix: 'Chi phí lương', prefixHH: 'Chi phí hoa hồng',
    applyHH: sheetType === 'Fulltime', labelSuffix,
  });
}

function findBuiltinRule(sheetType, name) {
  if (sheetType === 'Fulltime') return BUILTIN_FULLTIME_RULES.find(r => r.match === name);
  if (sheetType === 'Parttime') return BUILTIN_PARTTIME_RULES.find(r => r.match === name);
  return null;
}

// Resolve effective rule: user override > built-in. Returns merged rule or null.
function resolveRule(sheetType, name, userRules) {
  const builtin = findBuiltinRule(sheetType, name);
  const userRule = userRules[`${sheetType}|${name}`];
  if (userRule && builtin) return { ...builtin, ...userRule, _source: 'edited' };
  if (userRule) return { ...userRule, _source: 'custom' };
  if (builtin) return { ...builtin, _source: 'builtin' };
  return null;
}

// Main sheet processor - returns {rows, pending}
function processSheet(ws, sheetType, period, userRules) {
  const subs = detectSubtotals(ws);
  const rows = [];
  const pending = [];

  const containerNames = sheetType === 'Fulltime' ? FT_CONTAINER_NAMES
    : sheetType === 'Parttime' ? PT_CONTAINER_NAMES : new Set();

  for (const s of subs) {
    const name = s.name;
    if (containerNames.has(name)) continue;

    const empRows = directRows(s, subs);
    if (empRows.length === 0) continue;

    // NSNN: auto 6224 (no wizard needed)
    if (sheetType === 'NSNN') {
      const sumP = sumCol(ws, empRows, COL_P);
      const abbrName = name.replace(/^Bộ [Pp]hận\s+/, 'BP ');
      pushRow(rows, period, 'lương', `${abbrName} (NSNN)`, '6224', sumP, META_BACKOFFICE);
      continue;
    }

    const rule = resolveRule(sheetType, name, userRules);
    if (!rule) {
      pending.push({
        sheetType, name, row: s.row,
        employees: employeeInfo(ws, empRows),
        totalP: sumCol(ws, empRows, COL_P),
        totalL: sumCol(ws, empRows, COL_L),
      });
      continue;
    }

    // Dispatch: kind → built-in/edited built-in; no kind → custom (wizard-created)
    if (sheetType === 'Fulltime' && rule.kind) {
      rows.push(...processBuiltinFulltime(ws, s, subs, rule, period));
    } else {
      rows.push(...processCustomRule(ws, s, subs, rule, period, sheetType));
    }
  }
  return { rows, pending };
}

// Find sheet of a given kind (Fulltime/Parttime/NSNN) using auto-detect + user override.
// sheetMap is optional: { [sheetName]: 'Fulltime'|'Parttime'|'NSNN'|'skip' }
function findSheetByKind(wb, kind, sheetMap) {
  // User override wins
  if (sheetMap) {
    for (const n of wb.SheetNames) {
      if (sheetMap[n] === kind) return n;
    }
  }
  // Fall back to auto-detect
  for (const n of wb.SheetNames) {
    const override = sheetMap ? sheetMap[n] : null;
    if (override === 'skip') continue;
    if (override) continue; // Already processed above
    const pn = parseSheetName(n);
    if (pn && pn.kind === kind) return n;
  }
  return null;
}

// Returns the final classification for each sheet: kind or null
function classifySheet(sheetName, sheetMap) {
  if (sheetMap && sheetMap[sheetName] !== undefined) {
    return sheetMap[sheetName] === 'skip' ? null : sheetMap[sheetName];
  }
  const pn = parseSheetName(sheetName);
  return pn ? pn.kind : null;
}

// Get period from a workbook: prefer Fulltime's parsed name, else first classified sheet
function getPeriod(wb, sheetMap) {
  const ft = findSheetByKind(wb, 'Fulltime', sheetMap);
  if (ft) {
    const pn = parseSheetName(ft);
    if (pn) return { month: pn.month, year: pn.year, mm: pad2(pn.month), yyyy: pn.year };
  }
  for (const n of wb.SheetNames) {
    const k = classifySheet(n, sheetMap);
    if (!k) continue;
    const pn = parseSheetName(n);
    if (pn) return { month: pn.month, year: pn.year, mm: pad2(pn.month), yyyy: pn.year };
  }
  return null;
}


// File 1: Hạch toán lương — uses processSheet (existing logic)
function generateFile1_Salary(wb, period, userRules, sheetMap) {
  const rows = []; const pending = [];
  for (const sheetName of wb.SheetNames) {
    const kind = classifySheet(sheetName, sheetMap);
    if (!kind) continue;
    const ws = wb.Sheets[sheetName];
    const res = processSheet(ws, kind, { mm: period.mm, yyyy: period.yyyy }, userRules);
    rows.push(...res.rows);
    pending.push(...res.pending);
  }
  return { rows, pending };
}

// File 2: TNCN — 1 row total across 3 sheets, col AD
function generateFile2_TNCN(wb, period, sheetMap) {
  let totalAD = 0;
  for (const sheetName of wb.SheetNames) {
    const kind = classifySheet(sheetName, sheetMap);
    if (!kind) continue;
    const ws = wb.Sheets[sheetName];
    const subs = detectSubtotals(ws);
    const allEmpRows = new Set();
    for (const s of subs) {
      const dr = directRows(s, subs);
      for (const r of dr) allEmpRows.add(r);
    }
    for (const r of allEmpRows) {
      totalAD += getCellVal(ws, r, COL_AD);
    }
  }
  const rows = [];
  if (totalAD > 0) {
    rows.push({
      dienGiai: `Thuế TNCN T${period.mm}/${period.yyyy}`,
      dienGiaiHT: `Thuế TNCN T${period.mm}/${period.yyyy}`,
      tkNo: '3341', tkCo: '3335', soTien: totalAD,
      maDTNo: 'NVprep', maDTCo: '',
      ...META_BACKOFFICE,
    });
  }
  return { rows };
}

// File 4: Chi phí BHXH/BHYT/BHTN/BHTNLĐ — per bộ phận, Fulltime only, 4 cols
function generateFile4_CPBH(wb, period, userRules, sheetMap) {
  const ftSheet = findSheetByKind(wb, 'Fulltime', sheetMap);
  if (!ftSheet) return { rows: [] };
  const ws = wb.Sheets[ftSheet];
  const dienGiaiChung = `Chi phí BHXH, BHYT, BHTN, BHTNLĐ T${period.mm}/${period.yyyy}`;
  const specs = [
    { col: COL_Q, tk: '3383', label: 'BHXH', prefix: 'Chi phí BHXH' },
    { col: COL_R, tk: '3384', label: 'BHYT', prefix: 'Chi phí BHYT' },
    { col: COL_S, tk: '3386', label: 'BHTN', prefix: 'Chi phí BHTN' },
    { col: COL_T, tk: '3389', label: 'BHTNLĐ', prefix: 'Chi phí BHTNLĐ' },
  ];
  const allRows = [];
  for (const sp of specs) {
    const res = processSheetWithCtx(ws, 'Fulltime', period, userRules, {
      column: sp.col, tkCo: sp.tk, prefix: sp.prefix,
      applyHH: false, maDTNo: 'NVprep', maDTCo: 'BHXHBTL',
    });
    for (const r of res.rows) r.dienGiai = dienGiaiChung;
    allRows.push(...res.rows);
  }
  return { rows: allRows };
}

// File 5: Khấu trừ BH vào lương — 3 rows total, Fulltime only
function generateFile5_KhauTruBH(wb, period, sheetMap) {
  const ftSheet = findSheetByKind(wb, 'Fulltime', sheetMap);
  if (!ftSheet) return { rows: [] };
  const ws = wb.Sheets[ftSheet];
  const subs = detectSubtotals(ws);
  // Collect all employee rows
  const allEmpRows = new Set();
  for (const s of subs) {
    if (FT_CONTAINER_NAMES.has(s.name)) continue;
    for (const r of directRows(s, subs)) allEmpRows.add(r);
  }
  const sumV = [...allEmpRows].reduce((a, r) => a + getCellVal(ws, r, COL_V), 0);
  const sumW = [...allEmpRows].reduce((a, r) => a + getCellVal(ws, r, COL_W), 0);
  const sumX = [...allEmpRows].reduce((a, r) => a + getCellVal(ws, r, COL_X), 0);
  const dienGiaiChung = `Trích bảo hiểm vào lương nhân sự T${period.mm}/${period.yyyy}`;
  const rows = [];
  const mkRow = (tk, prefix, amount) => ({
    dienGiai: dienGiaiChung,
    dienGiaiHT: `${prefix} T${period.mm}/${period.yyyy}`,
    tkNo: '3341', tkCo: tk, soTien: amount,
    maDTNo: 'NVprep', maDTCo: 'BHXHBTL',
    ...META_BACKOFFICE,
  });
  if (sumV) rows.push(mkRow('3383', 'Trích BHXH', sumV));
  if (sumW) rows.push(mkRow('3384', 'Trích BHYT', sumW));
  if (sumX) rows.push(mkRow('3386', 'Trích BHTN', sumX));
  return { rows };
}

// File 6: KPCĐ trừ lương NLĐ — per bộ phận, Fulltime only, col Y, TK Nợ 3341 fixed, TK Có 3382

function lastDayOfMonth(year, month) { return new Date(year, month, 0).getDate(); }
function pad2(n) { return String(n).padStart(2, '0'); }

];
const MISA_GROUP_HEADERS = [
  '', '', '', '', '', '', 'Chi tiết hạch toán', '', '', '', '', '', '',
  'Hóa đơn', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '',
];

function buildMisaWorkbook(rows, period, docNumber, dateStr) {
  if (!dateStr) {
    const dd = pad2(lastDayOfMonth(period.yyyy, period.mm));
    dateStr = `${dd}/${period.mm}/${period.yyyy}`;
  }
  const aoa = [
    ['FILE MẪU CHỨNG TỪ NGHIỆP VỤ KHÁC ĐỂ NHẬP VÀO PHẦN MỀM AMIS ACCOUNTING'],
    ['Hướng dẫn:'],
    ['- Điền dữ liệu vào các cột tương ứng trên file này'],
    ['- Các cột có dấu (*) là những cột bắt buộc'],
    ['- Nếu muốn nhập nhiều thông tin hơn người dùng có thể tải mẫu đầy đủ/hoặc tự thêm cột trên mẫu cơ bản'],
    ['- Các dòng dữ liệu phía dưới chỉ là ví dụ minh họa'],
    MISA_GROUP_HEADERS, MISA_HEADERS,
  ];
  for (const r of rows) {
    const dataRow = new Array(34).fill('');
    dataRow[0] = dateStr; dataRow[1] = dateStr; dataRow[2] = docNumber;
    dataRow[3] = r.dienGiai; dataRow[6] = r.dienGiaiHT;
    dataRow[7] = r.tkNo; dataRow[8] = r.tkCo;
    dataRow[9] = Math.round(r.soTien);
    // Mã đối tượng Nợ (11) / Mã đối tượng Có (12)
    dataRow[11] = r.maDTNo || '';
    dataRow[12] = r.maDTCo || '';
    // 4 extra fields: cols 31-34 (index 30-33)
    dataRow[30] = r.kenh || '';
    dataRow[31] = r.duAn || '';
    dataRow[32] = r.sanPham || '';
    dataRow[33] = r.thiTruong || '';
    aoa.push(dataRow);
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (let i = 8; i < aoa.length; i++) {
    const addr = XLSX.utils.encode_cell({ r: i, c: 9 });
    if (ws[addr]) ws[addr].z = '#,##0';
  }
  ws['!cols'] = [
    { wch: 14 }, { wch: 14 }, { wch: 18 }, { wch: 30 }, { wch: 10 }, { wch: 8 },
    { wch: 60 }, { wch: 8 }, { wch: 8 }, { wch: 18 }, { wch: 12 },
    ...Array(23).fill({ wch: 12 }),
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Nghiep vu khac');
  return wb;
}

const LS_KEY = 'prep-misa-userRules-v1';
function loadUserRules() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    // Migrate: ensure every rule has the 4 extra fields
    for (const k of Object.keys(obj)) {
      const r = obj[k];
      if (!r.kenh) r.kenh = 'Đa kênh';
      if (!r.duAn) r.duAn = 'Chung';
      if (!r.sanPham) r.sanPham = 'All';
      if (!r.thiTruong) r.thiTruong = 'VN';
    }
    return obj;
  } catch { return {}; }
}
function saveUserRules(rules) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(rules)); } catch {}
}

const FORMAT_VND = (n) => {
  if (typeof n !== 'number') return n;
  return new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 }).format(Math.round(n));
};

    const next = new Set(splitMaNVs);
    if (next.has(manv)) next.delete(manv); else next.add(manv);
    setSplitMaNVs(next);
  };

  const addAlloc = () => setAllocations([...allocations, { tk: '', percent: 0, misa: '', kenh: '', duAn: '', sanPham: '', thiTruong: '' }]);
  const removeAlloc = (i) => setAllocations(allocations.filter((_, idx) => idx !== i));

    next[i] = { ...next[i], [field]: v };

                          <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2 text-xs">
                            <div>
                              <label className="block mb-0.5" style={{ color: 'var(--ink-muted)' }}>Kênh (trống = mặc định)</label>
                              <input type="text" value={a.kenh} onChange={e => updateAlloc(i, 'kenh', e.target.value)} list={`k-a-${pending.name}-${i}`} />
                              <datalist id={`k-a-${pending.name}-${i}`}>{KENH_OPTIONS.map(v => <option key={v} value={v} />)}</datalist>
                            </div>
                            <div>
                              <label className="block mb-0.5" style={{ color: 'var(--ink-muted)' }}>Dự án</label>
                              <input type="text" value={a.duAn} onChange={e => updateAlloc(i, 'duAn', e.target.value)} list={`d-a-${pending.name}-${i}`} />
                              <datalist id={`d-a-${pending.name}-${i}`}>{DUAN_OPTIONS.map(v => <option key={v} value={v} />)}</datalist>
                            </div>
                            <div>
                              <label className="block mb-0.5" style={{ color: 'var(--ink-muted)' }}>Sản phẩm</label>
                              <input type="text" value={a.sanPham} onChange={e => updateAlloc(i, 'sanPham', e.target.value)} list={`s-a-${pending.name}-${i}`} />
                              <datalist id={`s-a-${pending.name}-${i}`}>{SANPHAM_OPTIONS.map(v => <option key={v} value={v} />)}</datalist>
                            </div>
                            <div>
                              <label className="block mb-0.5" style={{ color: 'var(--ink-muted)' }}>Thị trường</label>
                              <input type="text" value={a.thiTruong} onChange={e => updateAlloc(i, 'thiTruong', e.target.value)} list={`t-a-${pending.name}-${i}`} />
                              <datalist id={`t-a-${pending.name}-${i}`}>{THITRUONG_OPTIONS.map(v => <option key={v} value={v} />)}</datalist>
                            </div>
                          </div>
                        )}
                      </div>
                    ))}
                    <button className="btn-ghost text-xs" onClick={addAlloc}>+ Thêm TK</button>
                  </div>
                  {(() => {
                    const total = allocations.reduce((s, a) => s + Number(a.percent || 0), 0);
                    if (total !== 100 && splitMaNVs.size > 0) {
                      return <div className="text-xs mt-2" style={{ color: 'var(--warn)' }}>
                        ⚠ Tổng % hiện đang = {total}% (nên = 100%)
                      </div>;
                    }
                    return null;
                  })()}
                </div>

                <div className="text-xs p-3 card" style={{ color: 'var(--ink-muted)' }}>
                  Các NV còn lại (không được chọn) sẽ áp dụng rule mặc định ở trên (TK Chi phí + TK Hoa hồng nếu có).
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      <div className="flex gap-3 mt-6 pt-4" style={{ borderTop: '1px dashed var(--rule)' }}>
        <button className="btn-primary" onClick={handleSave} disabled={!canSave || (isFT && hasSplit && !hasValidSplit)}>
          ✓ Lưu rule & áp dụng
        </button>
        <button className="btn-ghost" onClick={onCancel}>Bỏ qua team này</button>
      </div>
    </div>
  );
}

/* =====================================================================
   RULE EDITOR (for existing rules - inline form)
   ===================================================================== */
function RuleEditor({ rule, sheetType, isBuiltin, onSave, onCancel }) {
  // rule may be a built-in or a merged (built-in + override)
  const [misa, setMisa] = useState(rule.misa || '');
  const [tkStr, setTkStr] = useState(Array.isArray(rule.tk) ? (rule.tk[0] || '') : (rule.tk || ''));
  const [tk2, setTk2] = useState(Array.isArray(rule.tk) ? (rule.tk[1] || '') : '');
  const [hasHH, setHasHH] = useState(!!rule.tkHH);
  const [tkHH, setTkHH] = useState(rule.tkHH || '');
  const [kenh, setKenh] = useState(rule.kenh || 'Đa kênh');
  const [duAn, setDuAn] = useState(rule.duAn || 'Chung');
  const [sanPham, setSanPham] = useState(rule.sanPham || 'All');
  const [thiTruong, setThiTruong] = useState(rule.thiTruong || 'VN');
  // Special fields for aca_rd_special
  const [specialMisa, setSpecialMisa] = useState(rule.specialMisa || '');
  const [specialTk, setSpecialTk] = useState(rule.specialTk || '');
  const [highMgrs, setHighMgrs] = useState((rule.highMgrs || []).join(', '));

  const isSplit = rule.kind === 'split_50_50';
  const isAcaRD = rule.kind === 'aca_rd_special';
  const isFT = sheetType === 'Fulltime';

  const save = () => {
    const out = {
      misa: misa.trim(),
      kenh: kenh.trim(), duAn: duAn.trim(),
      sanPham: sanPham.trim(), thiTruong: thiTruong.trim(),
    };
    if (rule.kind) out.kind = rule.kind; // preserve kind for built-in
    if (isSplit) {
      out.tk = [tkStr.trim(), tk2.trim()];
    } else {
      out.tk = tkStr.trim();
    }
    if (isFT && hasHH && !isSplit && !isAcaRD) {
      out.tkHH = tkHH.trim();
    }
    if (isAcaRD) {
      out.specialMisa = specialMisa.trim();
      out.specialTk = specialTk.trim();
      out.highMgrs = highMgrs.split(',').map(s => s.trim()).filter(Boolean);
    }
    // Preserve splits from original rule (for custom rules from wizard)
    if (rule.splits) out.splits = rule.splits;
    onSave(out);
  };

  const canSave = misa.trim() && tkStr.trim() && kenh.trim() && duAn.trim() && sanPham.trim() && thiTruong.trim()
    && (!isSplit || tk2.trim())
    && (!isAcaRD || (specialMisa.trim() && specialTk.trim()));

  return (
    <div className="p-4 mt-2" style={{ background: 'var(--bg)', border: '1px dashed var(--accent)' }}>
      <div className="space-y-4">
        <div>
          <label className="block text-xs tracking-wider uppercase mb-1" style={{ color: 'var(--ink-muted)' }}>Diễn giải MISA</label>
          <input type="text" value={misa} onChange={e => setMisa(e.target.value)} />
        </div>

        {isSplit ? (
          <div className="grid md:grid-cols-2 gap-3">
            <div>
              <label className="block text-xs tracking-wider uppercase mb-1" style={{ color: 'var(--ink-muted)' }}>TK (50%)</label>
              <input type="text" value={tkStr} onChange={e => setTkStr(e.target.value)} list="tk-list" />
            </div>
            <div>
              <label className="block text-xs tracking-wider uppercase mb-1" style={{ color: 'var(--ink-muted)' }}>TK thứ 2 (50%)</label>
              <input type="text" value={tk2} onChange={e => setTk2(e.target.value)} list="tk-list" />
            </div>
          </div>
        ) : (
          <div className="grid md:grid-cols-2 gap-3">
            <div>
              <label className="block text-xs tracking-wider uppercase mb-1" style={{ color: 'var(--ink-muted)' }}>
                TK Chi phí {isAcaRD && <span style={{ color: 'var(--ink-muted)' }}>(cho phần R&D + NV còn lại)</span>}
              </label>
              <input type="text" value={tkStr} onChange={e => setTkStr(e.target.value)} list="tk-list" />
            </div>
            {isFT && !isAcaRD && (
              <div>
                <label className="flex items-center gap-2 text-xs tracking-wider uppercase mb-1" style={{ color: 'var(--ink-muted)' }}>
                  <input type="checkbox" checked={hasHH} onChange={e => setHasHH(e.target.checked)} />
                  TK Hoa hồng (nếu có)
                </label>
                <input type="text" value={tkHH} onChange={e => setTkHH(e.target.value)} disabled={!hasHH} list="tk-list"
                  style={{ opacity: hasHH ? 1 : 0.4 }} />
              </div>
            )}
          </div>
        )}

        {isAcaRD && (
          <div className="p-3" style={{ background: 'var(--bg-card)', border: '1px solid var(--rule)' }}>
            <div className="text-xs tracking-wider uppercase mb-2" style={{ color: 'var(--accent-warm)' }}>
              Phần đặc biệt (tách 50/50 cho NV cấp cao)
            </div>
            <div className="grid md:grid-cols-2 gap-3 mb-3">
              <div>
                <label className="block text-xs mb-1" style={{ color: 'var(--ink-muted)' }}>Diễn giải phần đặc biệt</label>
                <input type="text" value={specialMisa} onChange={e => setSpecialMisa(e.target.value)} />
              </div>
              <div>
                <label className="block text-xs mb-1" style={{ color: 'var(--ink-muted)' }}>TK phần đặc biệt</label>
                <input type="text" value={specialTk} onChange={e => setSpecialTk(e.target.value)} list="tk-list" />
              </div>
            </div>
            <div>
              <label className="block text-xs mb-1" style={{ color: 'var(--ink-muted)' }}>
                Mã NV cấp cao (phân cách bằng dấu phẩy) - 50% thu nhập của họ sẽ vào TK đặc biệt
              </label>
              <input type="text" value={highMgrs} onChange={e => setHighMgrs(e.target.value)} placeholder="F0063, F0172" />
            </div>
          </div>
        )}

        <div>
          <div className="text-xs tracking-wider uppercase mb-2" style={{ color: 'var(--ink-muted)' }}>4 trường thông tin bổ sung</div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div>
              <label className="block text-xs mb-1" style={{ color: 'var(--ink-muted)' }}>Kênh</label>
              <input type="text" value={kenh} onChange={e => setKenh(e.target.value)} list="kenh-list" />
            </div>
            <div>
              <label className="block text-xs mb-1" style={{ color: 'var(--ink-muted)' }}>Dự án</label>
              <input type="text" value={duAn} onChange={e => setDuAn(e.target.value)} list="duan-list" />
            </div>
            <div>
              <label className="block text-xs mb-1" style={{ color: 'var(--ink-muted)' }}>Sản phẩm</label>
              <input type="text" value={sanPham} onChange={e => setSanPham(e.target.value)} list="sp-list" />
            </div>
            <div>
              <label className="block text-xs mb-1" style={{ color: 'var(--ink-muted)' }}>Thị trường</label>
              <input type="text" value={thiTruong} onChange={e => setThiTruong(e.target.value)} list="tt-list" />
            </div>
          </div>
        </div>

        {rule.splits && rule.splits.length > 0 && (
          <div className="text-xs p-3" style={{ background: 'var(--warn-bg)', color: 'var(--warn)' }}>
            ⓘ Rule này có {rule.splits[0].maNVs.length} NV được tách % sang nhiều TK (tạo từ wizard).
            Edit tại đây chỉ cập nhật TK mặc định + 4 trường. Để sửa danh sách tách %, xoá rule này và tạo lại từ wizard.
          </div>
        )}

        <div className="flex gap-2 pt-2" style={{ borderTop: '1px dashed var(--rule)' }}>
          <button className="btn-primary" onClick={save} disabled={!canSave}>✓ Lưu</button>
          <button className="btn-ghost" onClick={onCancel}>Huỷ</button>
        </div>
      </div>
    </div>
  );
}
