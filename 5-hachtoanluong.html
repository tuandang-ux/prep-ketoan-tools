}

function RuleManagerPanel({ userRules, onUpdate, onClose }) {
  const [tab, setTab] = useState('Fulltime');
  const [search, setSearch] = useState('');
  const [editingKey, setEditingKey] = useState(null);

  // Build lists per tab
  const ftList = useMemo(() => {
    const items = [];
    for (const b of BUILTIN_FULLTIME_RULES) {
      const key = `Fulltime|${b.match}`;
      const user = userRules[key];
      const merged = user ? { ...b, ...user } : b;
      items.push({ key, name: b.match, rule: merged, status: user ? 'edited' : 'builtin' });
    }
    // Custom FT teams (not in built-in)
    for (const key of Object.keys(userRules)) {
      if (!key.startsWith('Fulltime|')) continue;
      const name = key.substring('Fulltime|'.length);
      if (BUILTIN_FULLTIME_RULES.find(b => b.match === name)) continue;
      items.push({ key, name, rule: userRules[key], status: 'custom' });
    }
    return items;
  }, [userRules]);

  const ptList = useMemo(() => {
    const items = [];
    for (const b of BUILTIN_PARTTIME_RULES) {
      const key = `Parttime|${b.match}`;
      const user = userRules[key];
      const merged = user ? { ...b, ...user } : b;
      items.push({ key, name: b.match, rule: merged, status: user ? 'edited' : 'builtin' });
    }
    for (const key of Object.keys(userRules)) {
      if (!key.startsWith('Parttime|')) continue;
      const name = key.substring('Parttime|'.length);
      if (BUILTIN_PARTTIME_RULES.find(b => b.match === name)) continue;
      items.push({ key, name, rule: userRules[key], status: 'custom' });
    }
    return items;
  }, [userRules]);

  const filter = (items) => {
    if (!search.trim()) return items;
    const q = search.toLowerCase().trim();
    return items.filter(i =>
      i.name.toLowerCase().includes(q) ||
      (i.rule.misa || '').toLowerCase().includes(q) ||
      (i.rule.tk + '' || '').toLowerCase().includes(q)
    );
  };

  const currentList = tab === 'Fulltime' ? filter(ftList) : tab === 'Parttime' ? filter(ptList) : [];

  const handleSaveEdit = (key, updates) => {
    onUpdate({ ...userRules, [key]: updates });
    setEditingKey(null);
  };
  const handleReset = (key) => {
    if (!confirm('Khôi phục rule này về mặc định?')) return;
    const next = { ...userRules };
    delete next[key];
    onUpdate(next);
  };
  const handleDelete = (key) => {
    if (!confirm('Xoá rule tuỳ chỉnh này?')) return;
    const next = { ...userRules };
    delete next[key];
    onUpdate(next);
  };

  return (
    <div>
      <datalist id="tk-list">{KNOWN_TK.map(t => <option key={t} value={t} />)}</datalist>
      <datalist id="kenh-list">{KENH_OPTIONS.map(v => <option key={v} value={v} />)}</datalist>
      <datalist id="duan-list">{DUAN_OPTIONS.map(v => <option key={v} value={v} />)}</datalist>
      <datalist id="sp-list">{SANPHAM_OPTIONS.map(v => <option key={v} value={v} />)}</datalist>
      <datalist id="tt-list">{THITRUONG_OPTIONS.map(v => <option key={v} value={v} />)}</datalist>

      <div className="flex items-baseline justify-between mb-6 flex-wrap gap-3">
        <h2 className="serif text-2xl" style={{ color: 'var(--accent)' }}>Quản lý rule hạch toán</h2>
        <button className="btn-ghost text-sm" onClick={onClose}>← Quay lại</button>
      </div>

      <div className="card p-4 mb-4 text-xs" style={{ color: 'var(--ink-muted)' }}>
        Edit TK Nợ, TK Hoa hồng, Diễn giải MISA, hoặc 4 trường thông tin bổ sung (Kênh, Dự án, Sản phẩm, Thị trường) của bất kỳ bộ phận nào.
        Bấm "Reset" để khôi phục rule mặc định. Thay đổi được lưu trong trình duyệt.
      </div>

      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <button className={`btn-ghost text-sm ${tab === 'Fulltime' ? '' : ''}`}
          style={{ background: tab === 'Fulltime' ? 'var(--accent)' : 'transparent', color: tab === 'Fulltime' ? '#f5f1e8' : 'var(--ink)' }}
          onClick={() => { setTab('Fulltime'); setEditingKey(null); }}>
          Fulltime ({ftList.length})
        </button>
        <button className="btn-ghost text-sm"
          style={{ background: tab === 'Parttime' ? 'var(--accent)' : 'transparent', color: tab === 'Parttime' ? '#f5f1e8' : 'var(--ink)' }}
          onClick={() => { setTab('Parttime'); setEditingKey(null); }}>
          Parttime ({ptList.length})
        </button>
        <button className="btn-ghost text-sm"
          style={{ background: tab === 'NSNN' ? 'var(--accent)' : 'transparent', color: tab === 'NSNN' ? '#f5f1e8' : 'var(--ink)' }}
          onClick={() => { setTab('NSNN'); setEditingKey(null); }}>
          NSNN
        </button>
        <input type="text" value={search} onChange={e => setSearch(e.target.value)}
          placeholder="Tìm theo tên team, diễn giải, TK..." style={{ flex: 1, minWidth: '200px' }} />
      </div>

      {tab === 'NSNN' && (
        <div className="card p-6 text-sm" style={{ color: 'var(--ink-muted)' }}>
          <div className="mb-2" style={{ color: 'var(--ink)' }}>Sheet NSNN — rule cố định:</div>
          <div className="num text-xs">
            Tất cả bộ phận trong sheet NSNN → TK <span style={{ color: 'var(--accent)' }}>6224</span>
            {' · '}Diễn giải: "&lt;tên bộ phận&gt; (NSNN)"
            {' · '}Đa kênh | Chung | All | VN
          </div>
          <div className="mt-3 text-xs">Không cấu hình được qua UI — nếu cần thay đổi, liên hệ để update code.</div>
        </div>
      )}

      {(tab === 'Fulltime' || tab === 'Parttime') && (
        <div className="card">
          {currentList.length === 0 && (
            <div className="p-8 text-center text-sm" style={{ color: 'var(--ink-muted)' }}>
              {search ? 'Không tìm thấy rule nào khớp.' : 'Không có rule.'}
            </div>
          )}
          {currentList.map(item => (
            <RuleRow
              key={item.key}
              sheetType={tab} name={item.name} rule={item.rule} status={item.status}
              onEdit={() => setEditingKey(item.key)}
              onReset={() => handleReset(item.key)}
              onDelete={() => handleDelete(item.key)}
              isEditing={editingKey === item.key}
              onSaveEdit={(updates) => handleSaveEdit(item.key, updates)}
              onCancelEdit={() => setEditingKey(null)}
            />
          ))}
        </div>
      )}
    </div>
  );
}

/* =====================================================================
   COLUMN MAPPING PANEL
   ===================================================================== */
function ColumnMappingPanel({ wb, ftSheetName, mapping, detectResult, onSave, onReset, onClose }) {
  const [local, setLocal] = useState({ ...mapping });
  const ws = wb && ftSheetName ? wb.Sheets[ftSheetName] : null;
  const cols = useMemo(() => {
    if (!ws) return [];
    const arr = readHeaders(ws);
    propagateGroupHeaders(arr);
    return arr;
  }, [ws]);

  // Generate dropdown options: first 40 cols
  const colOptions = cols.slice(0, 40).map(c => {
    const letter = colIdxToLetter(c.idx);
    const hdrShort = (c.r7 || c.r8 || '').replace(/\s+/g, ' ').trim().substring(0, 30);
    return { idx: c.idx, label: `${letter}${hdrShort ? ` - ${hdrShort}` : ''}` };
  });

  // Issues from auto-detect (for highlighting)
  const issueKeys = new Set((detectResult?.issues || []).map(i => i.field));

  // Get preview: first 3 employee rows in first subtotal group
  const preview = useMemo(() => {
    if (!ws) return [];
    const subs = detectSubtotals(ws);
    const firstSub = subs.find(s => !FT_CONTAINER_NAMES.has(s.name));
    if (!firstSub) return [];
    const rows = directRows(firstSub, subs).slice(0, 3);
    return rows.map(r => ({
      row: r,
      manv: getCellStr(ws, r, local.MANV),
      tongTN: getCellVal(ws, r, local.P_TONG_TN),
      bhxhDN: getCellVal(ws, r, local.Q_BHXH_DN),
      bhxhNLD: getCellVal(ws, r, local.V_BHXH_NLD),
      tncn: getCellVal(ws, r, local.AD_TNCN),
    }));
  }, [ws, local]);

  const handleSelect = (fieldKey, newIdx) => {
    setLocal(prev => ({ ...prev, [fieldKey]: newIdx }));
  };
  const handleApply = () => { onSave(local, false); };
  const handleApplyAndSave = () => { onSave(local, true); };

  if (!ws) {
    return (
      <div className="card p-4 mb-4 text-sm" style={{ color: 'var(--ink-muted)' }}>
        Không có sheet Fulltime để kiểm tra mapping.
        <button className="btn-ghost text-xs ml-4" onClick={onClose}>Đóng</button>
      </div>
    );
  }

  return (
    <div className="card p-4 mb-4">
      <div className="flex items-baseline justify-between mb-3 flex-wrap gap-2">
        <div>
          <h3 className="serif text-lg">Mapping cột từ file Excel</h3>
          <div className="text-xs" style={{ color: 'var(--ink-muted)' }}>
            Sheet: <span className="num">{ftSheetName}</span>
            {detectResult?.source === 'saved' && <> · <span style={{ color: 'var(--accent)' }}>Đang dùng mapping đã lưu</span></>}
            {detectResult?.source === 'auto' && detectResult.issues.length === 0 && <> · <span style={{ color: 'var(--accent)' }}>Auto-detect OK</span></>}
            {detectResult?.source === 'auto' && detectResult.issues.length > 0 && <> · <span style={{ color: 'var(--warn)' }}>{detectResult.issues.length} cột cần kiểm tra</span></>}
          </div>
        </div>
        <button className="btn-ghost text-xs" onClick={onClose}>Đóng</button>
      </div>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr style={{ borderBottom: '1px solid var(--rule)' }}>
              <th className="text-left py-2">Field</th>
              <th className="text-left py-2">Cột Excel</th>
              <th className="text-left py-2">Header đọc được</th>
              <th className="text-left py-2" style={{ width: '80px' }}>Trạng thái</th>
            </tr>
          </thead>
          <tbody>
            {FIELD_DEFS.map(fd => {
              const curIdx = local[fd.key];
              const hasIssue = issueKeys.has(fd.key);
              const col = cols.find(c => c.idx === curIdx);
              const hdr = col ? (col.r7 || col.r8 || '') : '';
              return (
                <tr key={fd.key} style={{ borderBottom: '1px dashed var(--rule)' }}>
                  <td className="py-2 pr-2">{fd.label}</td>
                  <td className="py-2 pr-2">
                    <select value={curIdx}
                      onChange={e => handleSelect(fd.key, parseInt(e.target.value, 10))}
                      style={{ padding: '4px 8px', fontSize: '0.8rem', minWidth: '200px' }}>
                      {colOptions.map(opt => (
                        <option key={opt.idx} value={opt.idx}>{opt.label}</option>
                      ))}
                    </select>
                  </td>
                  <td className="py-2 pr-2 text-xs num" style={{ color: 'var(--ink-muted)', maxWidth: '250px' }}>
                    {hdr.replace(/\s+/g, ' ')}
                  </td>
                  <td className="py-2 text-xs">
                    {hasIssue ? <span style={{ color: 'var(--warn)' }}>⚠ Kiểm tra</span> : <span style={{ color: 'var(--accent)' }}>✓</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {preview.length > 0 && (
        <div className="mt-4 pt-4" style={{ borderTop: '1px dashed var(--rule)' }}>
          <div className="text-xs tracking-wider uppercase mb-2" style={{ color: 'var(--ink-muted)' }}>
            Preview 3 NV đầu (từ {ftSheetName})
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs num">
              <thead>
                <tr style={{ borderBottom: '1px solid var(--rule)' }}>
                  <th className="text-left py-1">Mã NV</th>
                  <th className="text-right py-1">Tổng TN</th>
                  <th className="text-right py-1">BHXH DN</th>
                  <th className="text-right py-1">BHXH NLĐ</th>
                  <th className="text-right py-1">TNCN</th>
                </tr>
              </thead>
              <tbody>
                {preview.map((p, i) => (
                  <tr key={i} style={{ borderBottom: '1px dashed var(--rule)' }}>
                    <td className="py-1">{p.manv || '—'}</td>
                    <td className="text-right py-1">{p.tongTN ? FORMAT_VND(p.tongTN) : '—'}</td>
                    <td className="text-right py-1">{p.bhxhDN ? FORMAT_VND(p.bhxhDN) : '—'}</td>
                    <td className="text-right py-1">{p.bhxhNLD ? FORMAT_VND(p.bhxhNLD) : '—'}</td>
                    <td className="text-right py-1">{p.tncn ? FORMAT_VND(p.tncn) : '—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="text-xs mt-2" style={{ color: 'var(--ink-muted)' }}>
            Nếu số liệu có vẻ sai, đổi dropdown phía trên cho đến khi khớp. Rồi bấm Áp dụng.
          </div>
        </div>
      )}

      <div className="mt-4 pt-4 flex gap-2 flex-wrap" style={{ borderTop: '1px dashed var(--rule)' }}>
        <button className="btn-primary" onClick={handleApplyAndSave}>✓ Áp dụng &amp; Lưu cho file tương tự</button>
        <button className="btn-ghost" onClick={handleApply}>Áp dụng (không lưu)</button>
        <button className="btn-ghost text-xs" onClick={onReset}>↺ Reset về auto-detect</button>
      </div>
    </div>
  );
}

/* =====================================================================
   MAIN APP
   ===================================================================== */
function App() {
  const [userRules, setUserRules] = useState(() => loadUserRules());
  const [fileWb, setFileWb] = useState(null);
  const [fileName, setFileName] = useState(null);
  const [parsed, setParsed] = useState(null);
  const [processing, setProcessing] = useState(false);
  const [error, setError] = useState(null);
  const [fileMeta, setFileMeta] = useState(() =>
    Array(6).fill(null).map(() => ({ docNum: 'NVK8888T1/PREP28', date: '' }))
  );
  const [dragActive, setDragActive] = useState(false);
  const [showRulesPanel, setShowRulesPanel] = useState(false);
  const [showRuleManager, setShowRuleManager] = useState(false);
  const [skippedTeams, setSkippedTeams] = useState(new Set());
  const [sheetMap, setSheetMap] = useState({}); // { [sheetName]: 'Fulltime'|'Parttime'|'NSNN'|'skip' }
  // Column mapping state
  const [columnMapping, setColumnMapping] = useState({ ...DEFAULT_COLS });
  const [detectResult, setDetectResult] = useState(null); // { mapping, issues, fp, autoApplied, source }
  const [showMappingPanel, setShowMappingPanel] = useState(false);

  // Re-process whenever fileWb or userRules or skippedTeams or sheetMap or columnMapping change
  useEffect(() => {
    if (!fileWb) return;
    setCurrentColumns(columnMapping);
    reprocess(fileWb);
  }, [fileWb, userRules, skippedTeams, sheetMap, columnMapping]);

  const reprocess = (wb) => {
    setProcessing(true);
    try {
      let period = null;
      const warnings = [];
      const bySheet = {};
      const allPending = [];
      // Seen kinds for duplicate detection
      const seenKinds = {};

      for (const sheetName of wb.SheetNames) {
        const kind = classifySheet(sheetName, sheetMap);
        if (!kind) continue;
        if (seenKinds[kind]) {
          warnings.push(`Có nhiều sheet được gán là ${kind}: "${seenKinds[kind]}" và "${sheetName}". Chỉ xử lý sheet đầu.`);
          continue;
        }
        seenKinds[kind] = sheetName;

        const pn = parseSheetName(sheetName);
        if (pn) {
          const thisPeriod = { mm: pad2(pn.month), yyyy: pn.year };
          if (!period) period = { month: pn.month, year: pn.year, mm: thisPeriod.mm, yyyy: thisPeriod.yyyy };
          else if (period.month !== pn.month || period.year !== pn.year) {
            warnings.push(`Sheet "${sheetName}" có kỳ khác (${thisPeriod.mm}/${thisPeriod.yyyy} vs ${period.mm}/${period.yyyy})`);
          }
        }
        const ws = wb.Sheets[sheetName];
        // Use period if known else placeholder
        const usePeriod = period || { mm: '??', yyyy: '????' };
        const { rows, pending } = processSheet(ws, kind, usePeriod, userRules);
        const filteredPending = pending.filter(p => !skippedTeams.has(`${p.sheetType}|${p.name}`));
        bySheet[kind] = rows;
        allPending.push(...filteredPending);
      }

      if (!period) {
        // No period detected from sheet names. User must specify.
        warnings.push('Không tự động phát hiện được kỳ (tháng/năm) từ tên sheet. Vui lòng kiểm tra.');
        // Try to avoid crashing: use placeholder period but show warning
        period = { month: 0, year: 0, mm: '??', yyyy: '????' };
      }

      if (Object.keys(seenKinds).length === 0) {
        throw new Error('Không nhận diện được sheet Fulltime/Parttime/NSNN nào. Hãy dùng phần "Gán sheet thủ công" phía dưới.');
      }

      const allRows = [...(bySheet.Fulltime || []), ...(bySheet.Parttime || []), ...(bySheet.NSNN || [])];
      const byTK = {};
      for (const r of allRows) byTK[r.tkNo] = (byTK[r.tkNo] || 0) + r.soTien;
      const total = allRows.reduce((s, r) => s + r.soTien, 0);
      setParsed({ period, rows: allRows, bySheet, byTK, total, warnings, pending: allPending });
      setError(null);
    } catch (e) {
      console.error(e);
      setError(e.message || String(e));
      setParsed(null);
    } finally {
      setProcessing(false);
    }
  };

  const handleFile = useCallback(async (file) => {
    setError(null); setParsed(null); setProcessing(true);
    setSkippedTeams(new Set());
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { cellFormula: true, cellDates: false });
      // Initialize sheetMap: only set 'skip' for sheets we can't auto-detect.
      const initMap = {};
      for (const n of wb.SheetNames) {
        const pn = parseSheetName(n);
        if (!pn) initMap[n] = 'skip';
      }

      // Find Fulltime sheet (considering initial sheetMap) to run column detection.
      let ftSheetName = null;
      for (const n of wb.SheetNames) {
        if (initMap[n] === 'skip') continue;
        const pn = parseSheetName(n);
        if (pn && pn.kind === 'Fulltime') { ftSheetName = n; break; }
      }

      let newMapping = { ...DEFAULT_COLS };
      let detect = null;
      if (ftSheetName) {
        const ws = wb.Sheets[ftSheetName];
        const fp = computeWorkbookFingerprint(ws);
        const saved = loadSavedMappings()[fp];
        if (saved && saved.mapping) {
          // Use saved user-confirmed mapping
          newMapping = { ...DEFAULT_COLS, ...saved.mapping };
          detect = { mapping: saved.mapping, issues: [], fp, source: 'saved', autoApplied: true, sheetName: ftSheetName };
        } else {
          const result = autoDetectColumns(ws);
          newMapping = { ...DEFAULT_COLS, ...result.mapping };
          detect = { mapping: result.mapping, issues: result.issues, fp, source: 'auto', autoApplied: true, sheetName: ftSheetName };
        }
      }
      setColumnMapping(newMapping);
      setDetectResult(detect);
      setSheetMap(initMap);
      setFileName(file.name);
      setFileWb(wb);
    } catch (e) {
      console.error(e);
      setError(e.message || String(e));
      setProcessing(false);
    }
  }, []);

  // Helper to get effective meta for file i (1-based). Falls back to defaults.
  const getEffectiveMeta = (i) => {
    const m = fileMeta[i - 1] || { docNum: '', date: '' };
    const defaultDate = parsed
      ? `${pad2(lastDayOfMonth(parsed.period.yyyy, parsed.period.mm))}/${parsed.period.mm}/${parsed.period.yyyy}`
      : '';
    return {
      docNum: (m.docNum || '').trim() || 'NVK8888T1/PREP28',
      date: (m.date || '').trim() || defaultDate,
    };
  };
  const updateMeta = (i, field, value) => {
    setFileMeta(fm => fm.map((m, idx) => idx === i - 1 ? { ...m, [field]: value } : m));
  };

  // Returns {rows, filename} for a given file number
  const generateFileData = (fileNum) => {
    if (!parsed || !fileWb) return null;
    const period = parsed.period;
    if (fileNum === 1) return { rows: generateFile1_Salary(fileWb, period, userRules, sheetMap).rows, filename: 'F1_ChiPhiLuong' };
    if (fileNum === 2) return { rows: generateFile2_TNCN(fileWb, period, sheetMap).rows, filename: 'F2_ThueTNCN' };
    if (fileNum === 3) return { rows: generateFile3_KPCD_DN(fileWb, period, userRules, sheetMap).rows, filename: 'F3_KPCD_DN' };
    if (fileNum === 4) return { rows: generateFile4_CPBH(fileWb, period, userRules, sheetMap).rows, filename: 'F4_ChiPhiBaoHiem' };
    if (fileNum === 5) return { rows: generateFile5_KhauTruBH(fileWb, period, sheetMap).rows, filename: 'F5_KhauTruBH_VaoLuong' };
    if (fileNum === 6) return { rows: generateFile6_KPCD_NLD(fileWb, period, userRules, sheetMap).rows, filename: 'F6_KPCD_NLD' };
    return null;
  };

  const handleDownloadFile = (fileNum) => {
    if (!parsed || !fileWb) return;
    const data = generateFileData(fileNum);
    if (!data || data.rows.length === 0) {
      alert(`File ${fileNum} không có dữ liệu để xuất.`);
      return;
    }
    const meta = getEffectiveMeta(fileNum);
    const wb = buildMisaWorkbook(data.rows, parsed.period, meta.docNum, meta.date);
    XLSX.writeFile(wb, `MISA_${data.filename}_T${parsed.period.mm}_${parsed.period.yyyy}.xlsx`);
  };

  // For summary display of each file
  const fileSummaries = useMemo(() => {
    if (!parsed || !fileWb) return null;
    const period = parsed.period;
    return {
      f1: parsed.rows,
      f2: generateFile2_TNCN(fileWb, period, sheetMap).rows,
      f3: generateFile3_KPCD_DN(fileWb, period, userRules, sheetMap).rows,
      f4: generateFile4_CPBH(fileWb, period, userRules, sheetMap).rows,
      f5: generateFile5_KhauTruBH(fileWb, period, sheetMap).rows,
      f6: generateFile6_KPCD_NLD(fileWb, period, userRules, sheetMap).rows,
    };
  }, [parsed, fileWb, userRules, sheetMap]);

  const handleDownloadAllZip = async () => {
    if (!parsed || !fileWb) return;
    if (typeof JSZip === 'undefined') {
      alert('Thư viện JSZip chưa tải xong. Vui lòng chờ vài giây và thử lại.');
      return;
    }
    const zip = new JSZip();
    let count = 0;
    for (let i = 1; i <= 6; i++) {
      const data = generateFileData(i);
      if (!data || data.rows.length === 0) continue;
      const meta = getEffectiveMeta(i);
      const wb = buildMisaWorkbook(data.rows, parsed.period, meta.docNum, meta.date);
      const xlsxBuf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      zip.file(`MISA_${data.filename}_T${parsed.period.mm}_${parsed.period.yyyy}.xlsx`, xlsxBuf);
      count++;
    }
    if (count === 0) {
      alert('Không có file nào để xuất.');
      return;
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `MISA_6files_T${parsed.period.mm}_${parsed.period.yyyy}.zip`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const onDrop = (e) => {
    e.preventDefault(); setDragActive(false);
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  };

  const savePendingRule = (pending, rule) => {
    const key = `${pending.sheetType}|${pending.name}`;
    const next = { ...userRules, [key]: rule };
    setUserRules(next);
    saveUserRules(next);
  };

  const skipPending = (pending) => {
    const key = `${pending.sheetType}|${pending.name}`;
    setSkippedTeams(new Set([...skippedTeams, key]));
  };

  const deleteUserRule = (key) => {
    const next = { ...userRules };
    delete next[key];
    setUserRules(next);
    saveUserRules(next);
  };

  const clearAllUserRules = () => {
    if (!confirm('Xóa tất cả rule đã lưu? Lần sau mở file, tool sẽ hỏi lại từ đầu.')) return;
    setUserRules({});
    saveUserRules({});
  };

  const exportUserRules = () => {
    const blob = new Blob([JSON.stringify(userRules, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'prep_misa_user_rules.json'; a.click();
    URL.revokeObjectURL(url);
  };

  const importUserRules = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    f.text().then(txt => {
      try {
        const parsed = JSON.parse(txt);
        const next = { ...userRules, ...parsed };
        setUserRules(next); saveUserRules(next);
        alert(`Đã nhập ${Object.keys(parsed).length} rule.`);
      } catch (err) {
        alert('File không hợp lệ: ' + err.message);
      }
    });
  };

  const sortedTKs = useMemo(() => {
    if (!parsed) return [];
    return Object.entries(parsed.byTK).sort(([a], [b]) => a.localeCompare(b));
  }, [parsed]);

  const userRuleKeys = Object.keys(userRules);
  const hasUserRules = userRuleKeys.length > 0;

  return (
    <div className="min-h-screen" style={{ background: 'var(--bg)', color: 'var(--ink)' }}>
      <div className="max-w-6xl mx-auto px-8 py-12">
        <header className="mb-10 pb-6" style={{ borderBottom: '1px solid var(--rule)' }}>
          <div className="flex items-baseline justify-between flex-wrap gap-4">
            <div>
              <div className="text-xs tracking-widest mb-2" style={{ color: 'var(--accent-warm)' }}>
                PREP &mdash; KẾ TOÁN
              </div>
              <h1 className="serif text-4xl md:text-5xl leading-tight" style={{ color: 'var(--accent)' }}>
                Tool import chi phí lương
              </h1>
              <p className="mt-2" style={{ color: 'var(--ink-muted)' }}>
                Bảng lương Excel → Chứng từ nghiệp vụ khác để nhập vào MISA AMIS Kế toán.
              </p>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <button className="btn-ghost text-xs" onClick={() => { setShowRuleManager(!showRuleManager); setShowRulesPanel(false); }}>
                {showRuleManager ? 'Đóng quản lý rule' : 'Quản lý rule'}
              </button>
              {hasUserRules && !showRuleManager && (
                <button className="btn-ghost text-xs" onClick={() => setShowRulesPanel(!showRulesPanel)}>
                  {userRuleKeys.length} rule đã sửa/thêm
                </button>
              )}
              <div className="text-xs text-right" style={{ color: 'var(--ink-muted)' }}>
                <div>v9.5</div>
              </div>
            </div>
          </div>
        </header>

        {showRuleManager && (
          <RuleManagerPanel
            userRules={userRules}
            onUpdate={(next) => { setUserRules(next); saveUserRules(next); }}
            onClose={() => setShowRuleManager(false)}
          />
        )}

        {!showRuleManager && <>

        {/* User rules panel */}
        {showRulesPanel && (
          <section className="mb-8">
            <div className="card p-6">
              <div className="flex items-baseline justify-between mb-4 flex-wrap gap-2">
                <h2 className="serif text-lg">Rule đã lưu cho bộ phận mới ({userRuleKeys.length})</h2>
                <div className="flex gap-2 flex-wrap">
                  <button className="btn-ghost text-xs" onClick={exportUserRules}>↓ Export JSON</button>
                  <label className="btn-ghost text-xs cursor-pointer">
                    ↑ Import JSON
                    <input type="file" accept=".json" className="hidden" onChange={importUserRules} />
                  </label>
                  {hasUserRules && <button className="btn-danger" onClick={clearAllUserRules}>Xóa tất cả</button>}
                </div>
              </div>
              {!hasUserRules && <div className="text-sm" style={{ color: 'var(--ink-muted)' }}>Chưa có rule tùy chỉnh nào.</div>}
              <div className="space-y-2">
                {userRuleKeys.map(k => {
                  const r = userRules[k];
                  const [st, name] = k.split('|');
                  return (
                    <div key={k} className="flex items-start justify-between gap-3 py-2" style={{ borderBottom: '1px dashed var(--rule)' }}>
                      <div className="text-xs flex-1">
                        <div className="font-medium">{name} <span style={{ color: 'var(--ink-muted)' }}>({st})</span></div>
                        <div className="num mt-1" style={{ color: 'var(--ink-muted)' }}>
                          TK: {r.tk} {r.tkHH && `· HH: ${r.tkHH}`} {r.splits && `· ${r.splits[0].maNVs.length} NV tách %`}
                        </div>
                      </div>
                      <button className="btn-danger" style={{ padding: '0.25rem 0.5rem' }} onClick={() => deleteUserRule(k)}>Xóa</button>
                    </div>
                  );
                })}
              </div>
            </div>
          </section>
        )}

        {/* Upload */}
        {!fileWb && (
          <section className="mb-8">
            <div className="flex items-baseline gap-3 mb-4">
              <span className="serif text-2xl" style={{ color: 'var(--accent-warm)' }}>01</span>
              <h2 className="serif text-xl">Tải lên file bảng lương</h2>
            </div>
            <div
              className={`dropzone ${dragActive ? 'active' : ''} p-12 text-center cursor-pointer`}
              onDragEnter={e => { e.preventDefault(); setDragActive(true); }}
              onDragOver={e => { e.preventDefault(); setDragActive(true); }}
              onDragLeave={() => setDragActive(false)}
              onDrop={onDrop}
              onClick={() => document.getElementById('file-input').click()}
            >
              <input id="file-input" type="file" accept=".xlsx,.xls,.xlsm" className="hidden"
                onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
              <div className="serif text-2xl mb-2">Kéo thả file .xlsx</div>
              <div className="text-sm" style={{ color: 'var(--ink-muted)' }}>hoặc click để chọn</div>
              <div className="mt-6 text-xs" style={{ color: 'var(--ink-muted)' }}>
                File phải có các sheet chứa "Fulltime", "Parttime", "NSNN" (tự nhận diện linh hoạt - có thể gán thủ công nếu cần)
              </div>
            </div>
            {processing && <div className="mt-4 text-center num text-sm" style={{ color: 'var(--ink-muted)' }}>Đang xử lý...</div>}
            {error && (
              <div className="mt-4 p-4 card" style={{ borderColor: 'var(--error)', color: 'var(--error)' }}>
                <div className="tag mb-2">Lỗi</div><div className="text-sm">{error}</div>
              </div>
            )}
            {error && fileWb && fileWb.SheetNames && (
              <div className="mt-4 card p-4">
                <div className="text-sm font-medium mb-2">Gán sheet thủ công</div>
                <div className="text-xs mb-3" style={{ color: 'var(--ink-muted)' }}>
                  Tool không tự nhận diện được. Chọn kind cho từng sheet dưới đây:
                </div>
                <div className="space-y-2">
                  {fileWb.SheetNames.map(sn => {
                    const auto = parseSheetName(sn);
                    const autoKind = auto ? auto.kind : null;
                    const override = sheetMap[sn];
                    const current = override !== undefined ? override : 'auto';
                    return (
                      <div key={sn} className="flex items-center gap-3 flex-wrap py-1">
                        <div className="flex-1 min-w-0 text-sm" style={{ wordBreak: 'break-word' }}>
                          <span className="num">{sn}</span>
                          {autoKind && (
                            <span className="tag ml-2" style={{ color: 'var(--ink-muted)' }}>
                              Auto: {autoKind}{auto ? ` · T${pad2(auto.month)}/${auto.year}` : ''}
                            </span>
                          )}
                          {!autoKind && (
                            <span className="tag ml-2" style={{ color: 'var(--warn)' }}>Không nhận diện được</span>
                          )}
                        </div>
                        <select
                          value={current}
                          onChange={e => {
                            const v = e.target.value;
                            setSheetMap(prev => {
                              const next = { ...prev };
                              if (v === 'auto') delete next[sn];
                              else next[sn] = v;
                              return next;
                            });
                          }}
                          style={{ padding: '4px 8px', fontSize: '0.8rem', minWidth: '140px' }}
                        >
                          <option value="auto">Tự động{autoKind ? ` (${autoKind})` : ' (bỏ qua)'}</option>
                          <option value="Fulltime">Fulltime</option>
                          <option value="Parttime">Parttime</option>
                          <option value="NSNN">NSNN</option>
                          <option value="skip">Bỏ qua</option>
                        </select>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </section>
        )}

        {/* Pending teams wizard */}
        {parsed && parsed.pending.length > 0 && (
          <section className="mb-8">
            <div className="flex items-baseline gap-3 mb-4">
              <span className="serif text-2xl" style={{ color: 'var(--warn)' }}>!</span>
              <h2 className="serif text-xl" style={{ color: 'var(--warn)' }}>
                Phát hiện {parsed.pending.length} bộ phận mới cần thiết lập
              </h2>
            </div>
            <div className="card-warn p-4 mb-4 text-sm">
              Các bộ phận dưới đây chưa có rule hạch toán. Điền thông tin để tool biết cách hạch toán.
              Rule sẽ được lưu vào trình duyệt, lần sau upload file không cần nhập lại.
            </div>
            {parsed.pending.map((p, i) => (
              <PendingTeamForm
                key={`${p.sheetType}|${p.name}`}
                pending={p}
                onSave={(rule) => savePendingRule(p, rule)}
                onCancel={() => skipPending(p)}
              />
            ))}
          </section>
        )}

        {/* Results */}
        {parsed && (
          <>
            <section className="mb-8">
              <div className="flex items-baseline gap-3 mb-4">
                <span className="serif text-2xl" style={{ color: 'var(--accent-warm)' }}>
                  {parsed.pending.length > 0 ? '02' : '02'}
                </span>
                <h2 className="serif text-xl">Kết quả phân tích</h2>
              </div>

              <div className="card p-6 mb-4">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                  <div>
                    <div className="text-xs tracking-wider uppercase" style={{ color: 'var(--ink-muted)' }}>Kỳ</div>
                    <div className="serif text-3xl mt-1">{parsed.period.mm}/{parsed.period.yyyy}</div>
                  </div>
                  <div>
                    <div className="text-xs tracking-wider uppercase" style={{ color: 'var(--ink-muted)' }}>Số dòng bút toán</div>
                    <div className="serif text-3xl mt-1 num">{parsed.rows.length}</div>
                  </div>
                  <div>
                    <div className="text-xs tracking-wider uppercase" style={{ color: 'var(--ink-muted)' }}>Tổng số tiền (VND)</div>
                    <div className="serif text-3xl mt-1 num">{FORMAT_VND(parsed.total)}</div>
                  </div>
                  <div>
                    <div className="text-xs tracking-wider uppercase" style={{ color: 'var(--ink-muted)' }}>Số TK Nợ khác nhau</div>
                    <div className="serif text-3xl mt-1 num">{sortedTKs.length}</div>
                  </div>
                </div>
                <div className="mt-6 pt-4" style={{ borderTop: '1px dashed var(--rule)' }}>
                  <div className="text-xs" style={{ color: 'var(--ink-muted)' }}>
                    File: <span className="num">{fileName}</span>
                    {' · '}Fulltime: <span className="num">{(parsed.bySheet.Fulltime || []).length}</span>
                    {' · '}Parttime: <span className="num">{(parsed.bySheet.Parttime || []).length}</span>
                    {' · '}NSNN: <span className="num">{(parsed.bySheet.NSNN || []).length}</span>
                  </div>
                </div>
              </div>

              {parsed.warnings.length > 0 && (
                <div className="card p-4 mb-4" style={{ borderColor: 'var(--warn)' }}>
                  <div className="tag mb-2" style={{ color: 'var(--warn)' }}>Cảnh báo ({parsed.warnings.length})</div>
                  <ul className="text-sm space-y-1" style={{ color: 'var(--warn)' }}>
                    {parsed.warnings.map((w, i) => <li key={i}>• {w}</li>)}
                  </ul>
                </div>
              )}

              {/* Column mapping info bar + button to open panel */}
              {fileWb && detectResult && (
                <div className="flex items-center gap-3 mb-4 text-xs flex-wrap">
                  <div style={{ color: 'var(--ink-muted)' }}>
                    Mapping cột:
                    {detectResult.source === 'saved' && <span className="ml-2" style={{ color: 'var(--accent)' }}>✓ Dùng mapping đã lưu cho file này</span>}
                    {detectResult.source === 'auto' && detectResult.issues.length === 0 && <span className="ml-2" style={{ color: 'var(--accent)' }}>✓ Auto-detect đủ 14/14 cột</span>}
                    {detectResult.source === 'auto' && detectResult.issues.length > 0 && <span className="ml-2" style={{ color: 'var(--warn)' }}>⚠ {detectResult.issues.length} cột cần kiểm tra lại</span>}
                  </div>
                  <button className="btn-ghost text-xs" onClick={() => setShowMappingPanel(!showMappingPanel)}>
                    {showMappingPanel ? 'Đóng' : 'Kiểm tra / Sửa mapping cột'}
                  </button>
                </div>
              )}

              {showMappingPanel && fileWb && detectResult && (
                <ColumnMappingPanel
                  wb={fileWb}
                  ftSheetName={detectResult.sheetName}
                  mapping={columnMapping}
                  detectResult={detectResult}
                  onSave={(newMapping, persist) => {
                    setColumnMapping({ ...DEFAULT_COLS, ...newMapping });
                    if (persist && detectResult.fp) {
                      saveMappingForFP(detectResult.fp, newMapping, detectResult.sheetName);
                      setDetectResult(r => ({ ...r, source: 'saved', mapping: newMapping, issues: [] }));
                      alert('Đã lưu mapping. Lần sau upload file có cấu trúc tương tự, tool sẽ tự apply.');
                    }
                    setShowMappingPanel(false);
                  }}
                  onReset={() => {
                    if (detectResult.fp) deleteMappingForFP(detectResult.fp);
                    // Re-run auto-detect
                    const ws = fileWb.Sheets[detectResult.sheetName];
                    const result = autoDetectColumns(ws);
                    setColumnMapping({ ...DEFAULT_COLS, ...result.mapping });
                    setDetectResult({ ...detectResult, source: 'auto', mapping: result.mapping, issues: result.issues });
                  }}
                  onClose={() => setShowMappingPanel(false)}
                />
              )}

              {fileWb && (
                <details className="card p-4 mb-4" open={parsed.warnings.length > 0}>
                  <summary className="cursor-pointer text-sm font-medium">
                    Gán sheet thủ công ({fileWb.SheetNames.length} sheet trong file)
                  </summary>
                  <div className="mt-3 text-xs mb-3" style={{ color: 'var(--ink-muted)' }}>
                    Nếu tool nhận diện sai sheet Fulltime/Parttime/NSNN, chọn thủ công ở đây.
                    Chọn "Tự động" để tool tự đoán theo tên sheet.
                  </div>
                  <div className="space-y-2">
                    {fileWb.SheetNames.map(sn => {
                      const auto = parseSheetName(sn);
                      const autoKind = auto ? auto.kind : null;
                      const override = sheetMap[sn];
                      // current: what the dropdown should display
                      const current = override !== undefined ? override : 'auto';
                      return (
                        <div key={sn} className="flex items-center gap-3 flex-wrap py-1">
                          <div className="flex-1 min-w-0 text-sm" style={{ wordBreak: 'break-word' }}>
                            <span className="num">{sn}</span>
                            {autoKind && (
                              <span className="tag ml-2" style={{ color: 'var(--ink-muted)' }}>
                                Auto: {autoKind}{auto ? ` · T${pad2(auto.month)}/${auto.year}` : ''}
                              </span>
                            )}
                            {!autoKind && (
                              <span className="tag ml-2" style={{ color: 'var(--warn)' }}>Không nhận diện được</span>
                            )}
                          </div>
                          <select
                            value={current}
                            onChange={e => {
                              const v = e.target.value;
                              setSheetMap(prev => {
                                const next = { ...prev };
                                if (v === 'auto') delete next[sn];
                                else next[sn] = v;
                                return next;
                              });
                            }}
                            style={{ padding: '4px 8px', fontSize: '0.8rem', minWidth: '140px' }}
                          >
                            <option value="auto">Tự động{autoKind ? ` (${autoKind})` : ' (bỏ qua)'}</option>
                            <option value="Fulltime">Fulltime</option>
                            <option value="Parttime">Parttime</option>
                            <option value="NSNN">NSNN</option>
                            <option value="skip">Bỏ qua</option>
                          </select>
                        </div>
                      );
                    })}
                  </div>
                </details>
              )}

              <details className="card p-4 mb-4">
                <summary className="cursor-pointer text-sm font-medium">Tổng theo Tài khoản Nợ</summary>
                <table className="w-full mt-4 text-sm">
                  <thead>
                    <tr style={{ borderBottom: '1px solid var(--rule)' }}>
                      <th className="text-left py-2">TK Nợ</th>
                      <th className="text-right py-2">Số tiền</th>
                    </tr>
                  </thead>
                  <tbody>
                    {sortedTKs.map(([tk, amount]) => (
                      <tr key={tk} style={{ borderBottom: '1px dashed var(--rule)' }}>
                        <td className="py-2 num font-medium">{tk}</td>
                        <td className="py-2 text-right num">{FORMAT_VND(amount)}</td>
                      </tr>
                    ))}
                    <tr>
                      <td className="py-2 font-medium">TỔNG</td>
                      <td className="py-2 text-right num font-medium">{FORMAT_VND(parsed.total)}</td>
                    </tr>
                  </tbody>
                </table>
              </details>

              <details className="card p-4 mb-4" open>
                <summary className="cursor-pointer text-sm font-medium">Chi tiết {parsed.rows.length} bút toán</summary>
                <div className="overflow-x-auto mt-4">
                  <table className="w-full text-xs">
                    <thead>
                      <tr style={{ borderBottom: '1px solid var(--rule)' }}>
                        <th className="text-left py-2 pr-2 w-8">#</th>
                        <th className="text-left py-2 pr-2">Diễn giải hạch toán</th>
                        <th className="text-right py-2 pr-2 w-16">TK Nợ</th>
                        <th className="text-right py-2 pr-2 w-16">TK Có</th>
                        <th className="text-right py-2 pr-2 num w-32">Số tiền</th>
                        <th className="text-left py-2 pr-1 w-20">Kênh</th>
                        <th className="text-left py-2 pr-1 w-20">Dự án</th>
                        <th className="text-left py-2 pr-1 w-20">SP</th>
                        <th className="text-left py-2 w-12">TT</th>
                      </tr>
                    </thead>
                    <tbody>
                      {parsed.rows.map((r, i) => (
                        <tr key={i} style={{ borderBottom: '1px dashed var(--rule)' }}>
                          <td className="py-2 pr-2 num" style={{ color: 'var(--ink-muted)' }}>{i + 1}</td>
                          <td className="py-2 pr-2">{r.dienGiaiHT}</td>
                          <td className="py-2 pr-2 text-right num">{r.tkNo}</td>
                          <td className="py-2 pr-2 text-right num">{r.tkCo}</td>
                          <td className="py-2 pr-2 text-right num">{FORMAT_VND(r.soTien)}</td>
                          <td className="py-2 pr-1" style={{ color: 'var(--ink-muted)' }}>{r.kenh}</td>
                          <td className="py-2 pr-1" style={{ color: 'var(--ink-muted)' }}>{r.duAn}</td>
                          <td className="py-2 pr-1" style={{ color: 'var(--ink-muted)' }}>{r.sanPham}</td>
                          <td className="py-2" style={{ color: 'var(--ink-muted)' }}>{r.thiTruong}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </details>
            </section>

            <section className="mb-8">
              <div className="flex items-baseline gap-3 mb-4">
                <span className="serif text-2xl" style={{ color: 'var(--accent-warm)' }}>03</span>
                <h2 className="serif text-xl">Các file xuất để import MISA</h2>
              </div>
              <div className="card p-6">
                <div className="flex items-center justify-between mb-4 pb-4 flex-wrap gap-3" style={{ borderBottom: '1px dashed var(--rule)' }}>
                  <div className="text-xs" style={{ color: 'var(--ink-muted)' }}>
                    Mỗi file có Số chứng từ và Ngày chứng từ riêng. Mặc định: <span className="num">NVK8888T1/PREP28</span> và <span className="num">{pad2(lastDayOfMonth(parsed.period.yyyy, parsed.period.month))}/{parsed.period.mm}/{parsed.period.yyyy}</span>.
                  </div>
                  <button className="btn-primary" onClick={handleDownloadAllZip} disabled={parsed.pending.length > 0}>
                    ↓ Tải tất cả 6 file (.zip)
                  </button>
                </div>

                {parsed.pending.length > 0 && (
                  <div className="mb-4 p-3 text-xs" style={{ background: 'var(--warn-bg)', color: 'var(--warn)', border: '1px solid var(--warn)' }}>
                    ⚠ Vui lòng thiết lập rule cho {parsed.pending.length} bộ phận mới trước khi xuất file.
                  </div>
                )}

                {fileSummaries && [
                  { n: 1, name: 'File hạch toán lương', desc: 'Chi phí lương + hoa hồng theo từng bộ phận (3 sheets: FT+PT+NSNN)', rows: fileSummaries.f1 },
                  { n: 2, name: 'File hạch toán thuế TNCN', desc: 'Nợ 3341 / Có 3335. Tổng thuế TNCN (cột AD) của cả 3 sheets', rows: fileSummaries.f2 },
                  { n: 3, name: 'File hạch toán KPCĐ (DN trích)', desc: 'Nợ 6xx theo bộ phận / Có 3382. Cột U, sheet Fulltime', rows: fileSummaries.f3 },
                  { n: 4, name: 'File hạch toán chi phí bảo hiểm', desc: 'Nợ 6xx theo bộ phận / Có 3383, 3384, 3386, 3389. Cột Q/R/S/T, sheet Fulltime (4 loại BH)', rows: fileSummaries.f4 },
                  { n: 5, name: 'File khấu trừ bảo hiểm vào lương', desc: 'Nợ 3341 / Có 3383, 3384, 3386. Cột V/W/X, sheet Fulltime', rows: fileSummaries.f5 },
                  { n: 6, name: 'File hạch toán KPCĐ trừ vào lương NLĐ', desc: 'Nợ 3341 / Có 3382. Cột Y theo bộ phận, sheet Fulltime', rows: fileSummaries.f6 },
                ].map(f => {
                  const total = (f.rows || []).reduce((s, r) => s + r.soTien, 0);
                  const defaultDate = `${pad2(lastDayOfMonth(parsed.period.yyyy, parsed.period.month))}/${parsed.period.mm}/${parsed.period.yyyy}`;
                  const meta = fileMeta[f.n - 1] || { docNum: '', date: '' };
                  return (
                    <div key={f.n} className="py-3" style={{ borderBottom: '1px dashed var(--rule)' }}>
                      <div className="flex items-start gap-4 mb-2">
                        <div className="serif text-lg" style={{ color: 'var(--accent-warm)', minWidth: '2rem' }}>0{f.n}</div>
                        <div className="flex-1 min-w-0">
                          <div className="text-sm font-medium">{f.name}</div>
                          <div className="text-xs mt-0.5" style={{ color: 'var(--ink-muted)' }}>{f.desc}</div>
                          <div className="text-xs num mt-1" style={{ color: 'var(--accent)' }}>
                            {f.rows.length} dòng bút toán · Tổng: {FORMAT_VND(total)} VND
                          </div>
                        </div>
                        <button className="btn-ghost text-xs" onClick={() => handleDownloadFile(f.n)}
                          disabled={parsed.pending.length > 0 || f.rows.length === 0}>
                          ↓ Tải file
                        </button>
                      </div>
                      <div className="flex gap-3 ml-12 flex-wrap" style={{ fontSize: '0.7rem' }}>
                        <div style={{ minWidth: '200px', flex: '1 1 200px' }}>
                          <label className="block text-xs mb-0.5" style={{ color: 'var(--ink-muted)' }}>Số chứng từ</label>
                          <input type="text" value={meta.docNum} placeholder="NVK8888T1/PREP28"
                            onChange={e => updateMeta(f.n, 'docNum', e.target.value)}
                            style={{ padding: '4px 8px', fontSize: '0.8rem' }} />
                        </div>
                        <div style={{ minWidth: '160px', flex: '0 0 160px' }}>
                          <label className="block text-xs mb-0.5" style={{ color: 'var(--ink-muted)' }}>Ngày chứng từ (dd/mm/yyyy)</label>
                          <input type="text" value={meta.date} placeholder={defaultDate}
                            onChange={e => updateMeta(f.n, 'date', e.target.value)}
                            style={{ padding: '4px 8px', fontSize: '0.8rem' }} />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="mt-4 text-center">
                <button className="btn-ghost text-xs" onClick={() => { setFileWb(null); setFileName(null); setParsed(null); setError(null); setSkippedTeams(new Set()); setSheetMap({}); setColumnMapping({ ...DEFAULT_COLS }); setDetectResult(null); setShowMappingPanel(false); resetCurrentColumns(); }}>
                  ← Xử lý file khác
                </button>
              </div>
            </section>
          </>
        )}

        </>}

        <footer className="mt-16 pt-6 text-xs text-center" style={{ borderTop: '1px solid var(--rule)', color: 'var(--ink-muted)' }}>
          Dữ liệu được xử lý hoàn toàn trong trình duyệt. Không có thông tin lương nào gửi đi đâu. Rule tùy chỉnh được lưu local trong trình duyệt này.
        </footer>
      </div>
    </div>
  );
}

document.getElementById('loader').style.display = 'none';
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
